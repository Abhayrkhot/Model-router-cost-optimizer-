[project]
name = "modelrouter"
version = "0.1.0"
description = "Quality-aware LLM routing: predict which model can answer a request, trade cost against quality, and serve the policy behind an OpenAI-compatible gateway."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Abhay Khot" }]
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastembed>=0.4",
]

[project.optional-dependencies]
research = [
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "huggingface-hub>=0.24",
  "torch>=2.4",
]
gateway = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic>=0.40",
  "redis>=5.0",
  "prometheus-client>=0.20",
]

[project.scripts]
modelrouter = "modelrouter.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "fakeredis>=2.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelrouter"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "ASYNC"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src/modelrouter"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["data: needs the prepared RouterBench parquet (skipped when absent)"]
addopts = "-ra"
